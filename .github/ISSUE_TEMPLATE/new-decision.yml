name: New profile decision
description: Propose a new Nordic decision for NeTEx, SIRI or a data package.
title: ""
labels: [decision, proposed]
body:
  - type: markdown
    attributes:
      value: |
        GitHub assigns the issue number after submission. Use that number as the tracking ID, for example #123.
  - type: markdown
    attributes:
      value: |
        Describe the desired common Nordic decision. You do not need to know RDF or SHACL.
  - type: dropdown
    id: standard
    attributes:
      label: Standard or scope
      options:
        - NeTEx
        - SIRI
        - NeTEx and SIRI
        - Data package
    validations:
      required: true
  - type: input
    id: profile-version
    attributes:
      label: Profile and version
      description: Identify the profile and version this request is based on.
      placeholder: SIRI-FM v0.7 / SIRI 2.1
    validations:
      required: true
  - type: input
    id: subject
    attributes:
      label: Subject
      description: Exact class, property, service, message or package element. Use a QName, URI or XML element where available.
      placeholder: StopPlace.parentSiteRef
    validations:
      required: true
  - type: textarea
    id: protocol-targets
    attributes:
      label: Protocol targets and identifier mapping
      description: List the exact NeTEx and/or SIRI targets, including request/delivery messages and how identifiers such as FacilityRef resolve.
      placeholder: "SIRI FacilityMonitoringDelivery -> NeTEx Equipment id FSR:Equipment:1"
    validations:
      required: true
  - type: dropdown
    id: decision
    attributes:
      label: Proposed decision
      options:
        - Required
        - Optional
        - Excluded
        - Conditional
        - National extension
        - Informative guidance
        - Defer decision
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed rule
      description: State what should be allowed, required or excluded. Include cardinality, code values, timing, conditions and reference rules.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale and evidence
      description: Explain why this should be common Nordic practice. Cite document version, section and page for supplied specifications or examples.
    validations:
      required: true
  - type: checkboxes
    id: countries
    attributes:
      label: Countries considered
      options:
        - label: Norway
        - label: Sweden
        - label: Finland
        - label: Denmark
  - type: textarea
    id: example
    attributes:
      label: Example data
      description: Add valid and invalid examples, with the expected validation result. Avoid confidential data.
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and implementation impact
      description: Describe affected producers, consumers, profile versions and whether existing data or implementations break.
    validations:
      required: true
  - type: input
    id: proposer
    attributes:
      label: Proposer and organisation
    validations:
      required: true
