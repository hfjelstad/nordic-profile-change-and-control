name: Change existing decision
description: Propose a change to an accepted or implemented decision.
title: "[CHANGE] "
labels: [decision, change, proposed]
body:
  - type: input
    id: decision-id
    attributes:
      label: Decision ID
      placeholder: NP-0001
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason and evidence
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Describe effects on existing NeTEx, SIRI or data packages.
    validations:
      required: true
  - type: input
    id: proposer
    attributes:
      label: Proposer and organisation
    validations:
      required: true
