name: Clarification
description: Ask for clarification of an existing Nordic profile decision.
labels: [clarification]
body:
  - type: markdown
    attributes:
      value: |
        GitHub assigns the issue number after submission. Use that number as the tracking ID, for example #123.
  - type: input
    id: decision-id
    attributes:
      label: Decision ID or subject
      placeholder: NP-0001 or StopPlace.parentSiteRef
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What is unclear?
      description: Include the interpretation that caused the problem.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Add a small example or link. Avoid confidential data.
