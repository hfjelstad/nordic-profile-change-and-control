name: Accept decision

# The mechanical replacement for "someone hand-writes the decision YAML":
# add the "accept" label to a CCB issue that has an XML file attached, and
# this derives the decision file straight from the already-computed ontology
# diff (class/property/path/cardinality/codes) plus the issue's own title
# and Description field (copied verbatim) - no free-text interpretation.
#
# This opens a PR rather than committing straight to main: the PR review is
# the actual safety gate, not who was allowed to add the label. That also
# means the trigger itself can be relaxed later (e.g. a public button) without
# ever letting anything land on main without a human merging it. The PR is
# also set to auto-merge, so merging itself needs no separate click either -
# GitHub only lets it through once whatever branch protection exists (none
# yet, all CCB members' approval later) is satisfied.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  accept:
    if: github.event.label.name == 'accept'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Derive decision file(s) from the issue's XML
        id: draft
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python .github/scripts/draft_decision.py "${{ github.event.issue.number }}" "${{ github.event.issue.title }}" \
            | tee "${{ runner.temp }}/draft-decision.log"

      - name: Open a PR with the new decision file(s)
        id: pr
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git status --porcelain decisions/ | grep -q .; then
            git config user.name "nordic-profile-ccb-bot"
            git config user.email "actions@github.com"
            branch="accept/issue-${{ github.event.issue.number }}"
            git checkout -b "$branch"
            git add decisions/
            git commit -m "Accept decision for issue #${{ github.event.issue.number }} (mechanically derived)"
            git push origin "$branch" --force
            pr_url=$(gh pr create --title "Accept decision for issue #${{ github.event.issue.number }}" \
              --body "Mechanically derived from issue #${{ github.event.issue.number }}. Review the decision file, then merge to accept it." \
              --head "$branch" --base main)
            echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

            # Queues the merge rather than merging it now: once CODEOWNERS +
            # required reviews are switched on later, this correctly waits
            # for every required approval before merging, with nothing here
            # needing to change. Today there is no branch protection, so the
            # PR is immediately mergeable ("clean"), and GitHub's auto-merge
            # API refuses to queue a merge with nothing to wait for - in that
            # case just merge it directly instead.
            gh pr merge "$pr_url" --auto --squash || gh pr merge "$pr_url" --squash
          fi

      - name: Comment back on the issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s "${{ runner.temp }}/draft-decision.log" ]; then
            echo "Mechanically derived from this issue's XML (no manual write-up). Auto-merge is queued - it merges as soon as the required reviews (if any are configured) are in:" > "${{ runner.temp }}/comment.md"
            echo "" >> "${{ runner.temp }}/comment.md"
            echo "${{ steps.pr.outputs.pr_url }}" >> "${{ runner.temp }}/comment.md"
            echo "" >> "${{ runner.temp }}/comment.md"
            echo '```' >> "${{ runner.temp }}/comment.md"
            cat "${{ runner.temp }}/draft-decision.log" >> "${{ runner.temp }}/comment.md"
            echo '```' >> "${{ runner.temp }}/comment.md"
          else
            echo "Could not mechanically derive a decision from this issue (no XML file attached, or the check failed). See the workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "${{ runner.temp }}/comment.md"
          fi
          gh issue comment "${{ github.event.issue.number }}" --repo ${{ github.repository }} --body-file "${{ runner.temp }}/comment.md"
