rationale: >-
  StopPlace has no PrivateCode field in the Nordic baseline today (PrivateCode
  is only accepted on Line, Quay, GroupOfLines and ServiceJourney). Rail
  stations also carry an internationally recognised UIC station code, needed
  for cross-border interoperability (ticketing, TAF/TAP TSI, SIRI-FM). This
  decision adds PrivateCode as a repeatable field of StopPlace, wrapped in the
  standard NeTEx privateCodes collection (matching the existing
  StopPlace/quays/Quay wrapping pattern), with the type attribute set to
  "uicCode" to disambiguate it from any other external code system that may
  be proposed later. Scoped to the UIC use case shown in the evidence; other
  private code types on StopPlace need a separate follow-up decision.
